<!-- Inside your booking form section -->
<div class="card">
    <h3>Book Dispatch Service</h3>
    <div id="dynamic-rate-display">Calculated Rate: GHS <span id="rate-amount">20.00</span></div>
    
    <form id="dispatch-form">
        <label>Customer Email (For Receipt)</label>
        <input type="email" id="cust-email" value="customer@gmail.com" required>

        <label>Pickup Location</label>
        <input type="text" id="pickup-loc" placeholder="e.g. Manhyia, Kumasi" required>

        <label>Delivery Destination</label>
        <input type="text" id="dropoff-loc" placeholder="e.g. KNUST, Kumasi" required>

        <label>Package Type</label>
        <select id="package-type">
            <option value="Parcel Box">Parcel Box (Base 1x)</option>
            <option value="Heavy Freight">Heavy Freight (Multiplier 1.5x)</option>
        </select>

        <label>Recipient Phone</label>
        <input type="text" id="recip-phone" placeholder="+233..." required>

        <button type="button" id="pay-dispatch-btn" class="btn-primary">PAY & DISPATCH</button>
    </form>
</div>

<!-- Include Paystack Script -->
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
    // Dynamic distance/location price estimator logic
    function calculatePrice() {
        const pickup = document.getElementById('pickup-loc').value.trim();
        const dropoff = document.getElementById('dropoff-loc').value.trim();
        let baseRate = 20.00; // Base GHS for short local trips

        // Simple heuristic distance/zone estimation for demo/production calculation
        if (pickup.toLowerCase() !== dropoff.toLowerCase() && dropoff.length > 3) {
            baseRate = 35.00; // Inter-neighborhood rate
        }
        
        const packageType = document.getElementById('package-type').value;
        if (packageType === 'Heavy Freight') {
            baseRate *= 1.5;
        }

        document.getElementById('rate-amount').innerText = baseRate.toFixed(2);
        return baseRate * 100; // Convert to pesewas for Paystack
    }

    document.getElementById('pickup-loc').addEventListener('input', calculatePrice);
    document.getElementById('dropoff-loc').addEventListener('input', calculatePrice);
    document.getElementById('package-type').addEventListener('change', calculatePrice);

    document.getElementById('pay-dispatch-btn').addEventListener('click', function() {
        const email = document.getElementById('cust-email').value;
        const amountInPesewas = calculatePrice();
        const publicKey = 'pk_test_d57bf9fb79bb9eca6b9fac619aeb15243fc0eaee';

        let handler = PaystackPop.setup({
            key: publicKey,
            email: email,
            amount: amountInPesewas,
            currency: 'GHS',
            callback: function(response) {
                alert('Payment complete! Reference: ' + response.reference);
                // Send order data to backend database API
                recordOrder(response.reference);
            },
            onClose: function() {
                alert('Transaction window closed.');
            }
        });
        handler.openIframe();
    });

    async function recordOrder(reference) {
        await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                reference: reference,
                email: document.getElementById('cust-email').value,
                pickup: document.getElementById('pickup-loc').value,
                destination: document.getElementById('dropoff-loc').value,
                amount: document.getElementById('rate-amount').innerText
            })
        });
        window.location.reload();
    }
</script>
