<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Dispatch - Kumasi Logistics Engine</title>

    <!-- Real PWA Manifest Link -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .navbar { background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #ffffff; }
        .brand span { color: #38bdf8; }
        .nav-tabs { display: flex; background: #1f2937; padding: 3px; border-radius: 10px; }
        .tab-btn { background: transparent; color: #94a3b8; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #2563eb; color: #ffffff; }

        .main-container { flex: 1; display: flex; flex-direction: column; position: relative; height: calc(100vh - 57px); }
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

        .booking-panel { position: absolute; bottom: 0; left: 0; right: 0; background: #111827; border-top: 1px solid #1f2937; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 18px; z-index: 10; max-height: 55vh; overflow-y: auto; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #2563eb; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .price-summary { background: #1f2937; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; border: 1px solid #374151; }
        .price-label { font-size: 12px; color: #94a3b8; }
        .price-val { font-size: 20px; font-weight: 800; color: #38bdf8; }

        .btn-pay { width: 100%; padding: 15px; background: #2563eb; color: #ffffff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        #admin-view { flex: 1; padding: 20px; background: #0b0f19; overflow-y: auto; }
        .admin-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .admin-card h3 { font-size: 15px; margin-bottom: 12px; color: #f8fafc; }
        .driver-item { background: #1f2937; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .status-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">⚡ Swift <span>Dispatch</span></div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-cust" onclick="switchTab('customer')">Customer</button>
            <button class="tab-btn" id="tab-admin" onclick="switchTab('admin')">Admin & Drivers</button>
        </div>
    </div>

    <div id="customer-view" class="main-container view-section active">
        <div id="map"></div>

        <div class="booking-panel">
            <form id="dispatch-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Your Email</label>
                        <input type="email" id="cust-email" placeholder="customer@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="cust-phone" placeholder="055XXXXXXX" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pickup Location</label>
                    <select id="pickup-select" onchange="calculateRoute()">
                        <option value="6.6885,-1.6244">Manhyia Palace</option>
                        <option value="6.6972,-1.6225">Kejetia Market</option>
                        <option value="6.6731,-1.5654">KNUST Campus</option>
                        <option value="6.7112,-1.6489">Suame Magazine</option>
                        <option value="6.6580,-1.6189">Kumasi City Mall</option>
                        <option value="6.6912,-1.6789">Abuakwa Junction</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Delivery Destination</label>
                    <select id="dropoff-select" onchange="calculateRoute()">
                        <option value="6.6731,-1.5654">KNUST Campus</option>
                        <option value="6.6885,-1.6244">Manhyia Palace</option>
                        <option value="6.6972,-1.6225">Kejetia Market</option>
                        <option value="6.7112,-1.6489">Suame Magazine</option>
                        <option value="6.6580,-1.6189">Kumasi City Mall</option>
                        <option value="6.6912,-1.6789">Abuakwa Junction</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Package Type</label>
                    <select id="pkg-type" onchange="calculateRoute()">
                        <option value="1">Standard Envelope / Small Parcel (1x)</option>
                        <option value="1.4">Medium Box / Freight (1.4x)</option>
                    </select>
                </div>

                <div class="price-summary">
                    <div>
                        <div class="price-label">Distance: <span id="dist-km">0.0</span> km</div>
                        <div style="font-size: 11px; color: #64748b;">Rate: GHS 12 Base + 2.5/km</div>
                    </div>
                    <div class="price-val">GHS <span id="calculated-price">20.00</span></div>
                </div>

                <button type="button" class="btn-pay" onclick="payWithPaystack()">PAY & DISPATCH NOW</button>
            </form>
        </div>
    </div>

    <div id="admin-view" class="view-section">
        <div class="admin-card">
            <h3>Register Fleet Driver</h3>
            <form onsubmit="saveDriver(event)">
                <div class="form-group">
                    <label>Driver Full Name</label>
                    <input type="text" id="drv-name" placeholder="Kwame Mensah" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="drv-phone" placeholder="024XXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Vehicle Reg Number</label>
                    <input type="text" id="drv-plate" placeholder="M-24-AS 1024" required>
                </div>
                <button type="submit" class="btn-pay" style="background: #16a34a;">Register Driver</button>
            </form>
        </div>

        <div class="admin-card">
            <h3>Registered Drivers</h3>
            <div id="drivers-list-container">
                <p style="color: #64748b; font-size: 13px;">No drivers registered yet.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <script>
        let map = L.map('map').setView([6.6885, -1.6244], 13);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let polylineGroup = L.layerGroup().addTo(map);

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateRoute() {
            polylineGroup.clearLayers();

            const pVal = document.getElementById('pickup-select').value.split(',');
            const dVal = document.getElementById('dropoff-select').value.split(',');
            const pkgMult = parseFloat(document.getElementById('pkg-type').value);

            const pLat = parseFloat(pVal[0]), pLng = parseFloat(pVal[1]);
            const dLat = parseFloat(dVal[0]), dLng = parseFloat(dVal[1]);

            const km = getDistanceKm(pLat, pLng, dLat, dLng);
            document.getElementById('dist-km').innerText = km.toFixed(1);

            let calculatedPrice = (12.00 + (km * 2.50)) * pkgMult;
            if (calculatedPrice < 15.00) calculatedPrice = 15.00;

            document.getElementById('calculated-price').innerText = calculatedPrice.toFixed(2);

            const pMarker = L.marker([pLat, pLng]).bindPopup('Pickup Point').addTo(polylineGroup);
            const dMarker = L.marker([dLat, dLng]).bindPopup('Destination').addTo(polylineGroup);
            const line = L.polyline([[pLat, pLng], [dLat, dLng]], { color: '#2563eb', weight: 4 }).addTo(polylineGroup);

            map.fitBounds(line.getBounds(), { padding: [40, 40] });
            return calculatedPrice;
        }

        calculateRoute();

        function switchTab(tab) {
            if (tab === 'admin') {
                const pin = prompt("Enter Admin Security PIN:");
                if (pin !== "2026") {
                    alert("Incorrect PIN!");
                    return;
                }
            }

            document.getElementById('customer-view').classList.remove('active');
            document.getElementById('admin-view').classList.remove('active');
            document.getElementById('tab-cust').classList.remove('active');
            document.getElementById('tab-admin').classList.remove('active');

            if (tab === 'customer') {
                document.getElementById('customer-view').classList.add('active');
                document.getElementById('tab-cust').classList.add('active');
                setTimeout(() => map.invalidateSize(), 200);
            } else {
                document.getElementById('admin-view').classList.add('active');
                document.getElementById('tab-admin').classList.add('active');
                renderDrivers();
            }
        }

        function payWithPaystack() {
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const priceGHS = calculateRoute();

            if (!email || !phone) {
                alert("Please enter both your email address and phone number.");
                return;
            }

            let handler = PaystackPop.setup({
                key: 'pk_test_d57bf9fb79bb9eca6b9fac619aeb15243fc0eaee',
                email: email,
                amount: Math.round(priceGHS * 100),
                currency: 'GHS',
                metadata: {
                    custom_fields: [
                        { display_name: "Phone Number", variable_name: "phone_number", value: phone },
                        { display_name: "Pickup Location", variable_name: "pickup_location", value: document.getElementById('pickup-select').selectedOptions[0].text },
                        { display_name: "Delivery Destination", variable_name: "delivery_destination", value: document.getElementById('dropoff-select').selectedOptions[0].text }
                    ]
                },
                callback: function(response) {
                    alert('Payment successful! Reference: ' + response.reference);
                },
                onClose: function() {
                    alert('Payment transaction closed.');
                }
            });
            handler.openIframe();
        }

        let drivers = JSON.parse(localStorage.getItem('swift_drivers') || '[]');

        function saveDriver(e) {
            e.preventDefault();
            const name = document.getElementById('drv-name').value;
            const phone = document.getElementById('drv-phone').value;
            const plate = document.getElementById('drv-plate').value;

            drivers.push({ name, phone, plate });
            localStorage.setItem('swift_drivers', JSON.stringify(drivers));

            e.target.reset();
            renderDrivers();
            alert('Driver registered successfully!');
        }

        function renderDrivers() {
            const container = document.getElementById('drivers-list-container');
            if (drivers.length === 0) {
                container.innerHTML = '<p style="color: #64748b; font-size: 13px;">No drivers registered yet.</p>';
                return;
            }
            container.innerHTML = drivers.map(d => `
                <div class="driver-item">
                    <div>
                        <strong>${d.name}</strong> (${d.plate})<br>
                        <span style="font-size: 11px; color: #94a3b8;">Tel: ${d.phone}</span>
                    </div>
                    <span class="status-badge">Active</span>
                </div>
            `).join('');
        }

        // Register Standalone Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('SW Registered'))
                    .catch(err => console.error('SW Error:', err));
            });
        }
    </script>
</body>
</html>
