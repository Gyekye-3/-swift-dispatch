<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Swift Dispatch</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e3a8a" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-start sm:py-8 font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Mobile Screen Wrapper -->
  <main class="w-full max-w-md bg-slate-950 min-h-screen sm:min-h-0 sm:rounded-3xl border border-slate-800/80 shadow-2xl overflow-hidden flex flex-col">
    
    <!-- Top Status Bar / Header -->
    <header class="p-6 bg-gradient-to-b from-slate-900 to-slate-950 border-b border-slate-800/60">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white leading-tight">Swift Dispatch</h1>
            <p class="text-xs font-medium text-slate-400">On-Demand Courier Logistics</p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Live Neon PG
        </span>
      </div>

      <!-- Engine Status Chips -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2 flex items-center gap-2">
          <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-slate-300 truncate">Mode: <strong class="text-white">Customer</strong></span>
        </div>
        <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2 flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span class="text-slate-300 truncate"><strong class="text-white">Idempotent</strong> Safe</span>
        </div>
      </div>
    </header>

    <!-- Dispatch Form Body -->
    <div class="p-6 space-y-5 flex-1">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">New Dispatch Request</h2>
        <span class="text-xs text-slate-500">Step 1 of 2</span>
      </div>

      <form id="dispatch-form" class="space-y-4">
        <!-- Customer ID -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Customer ID</label>
          <input type="text" id="customerId" value="1" placeholder="e.g. CID1" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
        </div>

        <!-- Pickup Location -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Pickup Location</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <input type="text" id="pickupLocation" value="Warehouse 4, Central Accra" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
          </div>
        </div>

        <!-- Delivery Location -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Delivery Location</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            </div>
            <input type="text" id="deliveryLocation" value="12 Ring Road East, Labone" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
          </div>
        </div>

        <!-- Grid: Package Type & Phone -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Package Type</label>
            <select id="packageType" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
              <option value="Documents" selected>Documents</option>
              <option value="Parcel">Parcel</option>
              <option value="Fragile">Fragile</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Recipient Phone</label>
            <input type="tel" id="recipientPhone" value="+233 55 000 0000" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
          </div>
        </div>

        <!-- Idempotency Module -->
        <div class="p-3.5 bg-slate-900/60 border border-slate-800 rounded-2xl space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              Attach Idempotency Key
            </span>
            <input type="checkbox" id="useIdempotency" checked class="w-4 h-4 text-blue-600 rounded bg-slate-950 border-slate-700 focus:ring-blue-500" />
          </div>
          <div class="flex gap-2">
            <input type="text" id="idempotencyKey" readonly class="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-400" />
            <button type="button" id="renewKeyBtn" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-lg text-xs font-semibold hover:bg-blue-600/30 transition">Renew</button>
          </div>
          <p class="text-[11px] text-slate-500 leading-tight">Prevents duplicate order creation on network retries.</p>
        </div>

        <!-- Action Button -->
        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2 text-sm transition active:scale-[0.98]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          <span>DISPATCH REQUEST</span>
        </button>
      </form>

      <!-- Active Orders Monitor -->
      <div class="p-4 bg-slate-900/40 border border-slate-800/80 rounded-2xl flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 011 1v2a1 1 0 01-1 1m-1-4h-2m4 0h2a1 1 0 001-1v-4a1 1 0 00-1-1h-1m-1 5v-5"/></svg>
          </div>
          <div>
            <span class="text-xs font-semibold text-slate-300 block">Active Tracker</span>
            <span class="text-[11px] text-slate-500">0 Active Orders</span>
          </div>
        </div>
        <span class="w-2 h-2 rounded-full bg-slate-600"></span>
      </div>
    </div>
  </main>

  <script>
    function generateUUID() {
      return 'idx_' + Math.random().toString(36).substring(2, 9);
    }
    document.getElementById('idempotencyKey').value = generateUUID();
    document.getElementById('renewKeyBtn').addEventListener('click', () => {
      document.getElementById('idempotencyKey').value = generateUUID();
    });
  </script>
</body>
</html>
