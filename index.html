<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Dispatch - Logistics & Delivery</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header Navigation */
        .navbar { background: #1e293b; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { background: #334155; color: #cbd5e1; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: #2563eb; color: white; }

        /* Main Container */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Map Container */
        #map { flex: 1; width: 100%; min-height: 250px; z-index: 1; }

        /* Booking Overlay Panel */
        .panel { background: white; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); z-index: 2; max-height: 60vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }

        .route-box { background: #f1f5f9; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
        .price-tag { font-size: 20px; font-weight: 800; color: #16a34a; text-align: right; }

        .btn-pay { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-pay:hover { background: #1d4ed8; }

        /* Views */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* Admin / Driver Management */
        .admin-card { background: white; margin: 15px; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .driver-list-item { padding: 10px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <div class="brand">⚡ Swift Dispatch</div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-cust-btn" onclick="switchTab('customer')">Customer</button>
            <button class="tab-btn" id="tab-admin-btn" onclick="switchTab('admin')">Admin & Drivers</button>
        </div>
    </div>

    <!-- Customer Dispatch View -->
    <div id="customer-view" class="main-content view-section active">
        <!-- Interactive Kumasi Map -->
        <div id="map"></div>

        <!-- Booking Form Panel -->
        <div class="panel">
            <div class="route-box">
                <div class="form-group">
                    <label>Your Email Address</label>
                    <input type="email" id="cust-email" placeholder="e.g. felix@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Your Phone Number</label>
                    <input type="tel" id="cust-phone" placeholder="e.g. 0598211347" required>
                </div>
                <div class="form-group">
                    <label>Pickup Location</label>
                    <input type="text" id="pickup-loc" value="Manhyia, Kumasi" required>
                </div>
                <div class="form-group">
                    <label>Delivery Destination</label>
                    <input type="text" id="dropoff-loc" placeholder="e.g. KNUST Campus, Kumasi" value="KNUST, Kumasi" required>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <div><span style="font-size: 12px; color: #64748b;">Estimated Delivery Fee</span></div>
                    <div class="price-tag">GHS <span id="calc-price">25.00</span></div>
                </div>
            </div>

            <button type="button" class="btn-pay" onclick="triggerPaystackPayment()">PAY WITH MOBILE MONEY</button>
        </div>
    </div>

    <!-- Admin & Drivers View -->
    <div id="admin-view" class="view-section">
        <div class="admin-card">
            <h3>Register New Driver</h3>
            <form id="driver-reg-form" onsubmit="registerDriver(event)" style="margin-top: 10px;">
                <div class="form-group">
                    <label>Driver Full Name</label>
                    <input type="text" id="drv-name" placeholder="Kwame Mensah" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="drv-phone" placeholder="024XXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Motorbike / Vehicle Reg Number</label>
                    <input type="text" id="drv-plate" placeholder="M-24-AS 1024" required>
                </div>
                <button type="submit" class="btn-pay" style="background: #16a34a; padding: 10px;">Register Driver</button>
            </form>
        </div>

        <div class="admin-card">
            <h3>Registered Drivers</h3>
            <div id="drivers-container">
                <p style="color: #64748b; font-size: 13px; margin-top: 8px;">No drivers registered yet.</p>
            </div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Paystack Inline JS -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <script>
        // Initialize Map centered on Kumasi, Ghana
        let map = L.map('map').setView([6.6885, -1.6244], 13);
        
        // Use clean CartoDB map tile theme
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add default marker for Kumasi
        L.marker([6.6885, -1.6244]).addTo(map).bindPopup('Kumasi Central').openPopup();

        // Distance & Rate Calculator Heuristic
        function calculateDeliveryRate() {
            const pickup = document.getElementById('pickup-loc').value.trim();
            const dropoff = document.getElementById('dropoff-loc').value.trim();
            
            let price = 20.00;
            if (pickup.toLowerCase() !== dropoff.toLowerCase() && dropoff.length > 2) {
                price = 30.00; // Standard inter-suburb Kumasi dispatch rate
            }
            
            document.getElementById('calc-price').innerText = price.toFixed(2);
            return price;
        }

        document.getElementById('pickup-loc').addEventListener('input', calculateDeliveryRate);
        document.getElementById('dropoff-loc').addEventListener('input', calculateDeliveryRate);

        // Tab Switcher
        function switchTab(tab) {
            document.getElementById('customer-view').classList.remove('active');
            document.getElementById('admin-view').classList.remove('active');
            document.getElementById('tab-cust-btn').classList.remove('active');
            document.getElementById('tab-admin-btn').classList.remove('active');

            if (tab === 'customer') {
                document.getElementById('customer-view').classList.add('active');
                document.getElementById('tab-cust-btn').classList.add('active');
                setTimeout(() => map.invalidateSize(), 200);
            } else {
                document.getElementById('admin-view').classList.add('active');
                document.getElementById('tab-admin-btn').classList.add('active');
                renderDriversList();
            }
        }

        // Paystack Trigger Function
        function triggerPaystackPayment() {
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const priceGHS = calculateDeliveryRate();

            if (!email || !phone) {
                alert('Please enter your email and phone number to continue.');
                return;
            }

            // Paystack Setup
            let handler = PaystackPop.setup({
                key: 'pk_test_d57bf9fb79bb9eca6b9fac619aeb15243fc0eaee', // Test key (Replace with pk_live_ when Paystack approves account)
                email: email,
                amount: priceGHS * 100, // Pesewas
                currency: 'GHS',
                metadata: {
                    custom_fields: [
                        { display_name: "Mobile Number", variable_name: "mobile_number", value: phone },
                        { display_name: "Pickup Location", variable_name: "pickup_location", value: document.getElementById('pickup-loc').value },
                        { display_name: "Delivery Destination", variable_name: "delivery_destination", value: document.getElementById('dropoff-loc').value }
                    ]
                },
                callback: function(response) {
                    alert('Payment Successful! Reference: ' + response.reference);
                },
                onClose: function() {
                    alert('Payment process canceled.');
                }
            });
            handler.openIframe();
        }

        // Driver Management Local Storage Logic
        let driversList = JSON.parse(localStorage.getItem('swift_drivers') || '[]');

        function registerDriver(e) {
            e.preventDefault();
            const name = document.getElementById('drv-name').value;
            const phone = document.getElementById('drv-phone').value;
            const plate = document.getElementById('drv-plate').value;

            driversList.push({ id: Date.now(), name, phone, plate });
            localStorage.setItem('swift_drivers', JSON.stringify(driversList));

            document.getElementById('driver-reg-form').reset();
            renderDriversList();
            alert('Driver registered successfully!');
        }

        function renderDriversList() {
            const container = document.getElementById('drivers-container');
            if (driversList.length === 0) {
                container.innerHTML = '<p style="color: #64748b; font-size: 13px; margin-top: 8px;">No drivers registered yet.</p>';
                return;
            }

            container.innerHTML = driversList.map(d => `
                <div class="driver-list-item">
                    <div>
                        <strong>${d.name}</strong> (${d.plate})<br>
                        <span style="font-size: 12px; color: #64748b;">Phone: ${d.phone}</span>
                    </div>
                    <span style="background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;">Active</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
